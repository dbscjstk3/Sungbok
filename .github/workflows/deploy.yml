name: Deploy to InsForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: insforge-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INSFORGE_PROJECT_ID: fb135011-88fe-472d-bd8b-aedbca3a86aa
      INSFORGE_ORG_ID: 7a5056ef-943d-4100-b1e8-be96b214ceac
      INSFORGE_ACCESS_TOKEN: ${{ secrets.INSFORGE_ACCESS_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate InsForge credentials
        run: |
          if [[ "$INSFORGE_ACCESS_TOKEN" != uak_?* ]]; then
            echo "::error::Set INSFORGE_ACCESS_TOKEN in Actions secrets to a user API key (uak_...) from InsForge Profile > API Keys. Session access/refresh tokens are not supported by this workflow."
            exit 1
          fi

      - name: Log in to InsForge
        run: >-
          npx --yes @insforge/cli@0.2.8 login
          --user-api-key "$INSFORGE_ACCESS_TOKEN"
          --json

      - name: Install dependencies
        run: npm ci

      - name: Set up Compute build tool
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: 0.5.17

      - name: Build application
        run: npm run build

      - name: Link InsForge project
        run: >-
          npx --yes @insforge/cli@0.2.8 link
          --project-id "$INSFORGE_PROJECT_ID"
          --org-id "$INSFORGE_ORG_ID"
          --yes
          --json

      - name: Deploy to InsForge
        run: npm run deploy:compute
